<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>
    <section class="vh-100">
        <div class="row g-0 d-flex">
            <div class="col-12 col-lg-6 color">
                <img src="images/Image (2).png" class="img-fluid">
            </div>
            <div class="col-lg-6 col-12 d-flex flex-column justify-content-center align-items-center py-4"
                id="right-div">
                <div class="tallform col-10 d-flex flex-column justify-content-center align-items-center py-4"
                    id="tallform">
                    <h1>Create Your Account</h1>
                    <div class="col-10 d-flex  border rounded-5 p-1">
                        <button type="button" name="button" class="color border-0 rounded-5 col-6 py-2"
                            id="studentbtn">Student</button>
                        <button type="button" name="button" class=" bg-white rounded-5 border-0 col-6"
                            id="instructorbtn">Instructor</button>
                    </div>
                    <form class="col-10 d-flex flex-column justify-content-center align-items-center py-4" id="form1">
                        <div class="col-12 field">
                            <label>Full name</label>
                            <div class=" col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3">
                                <i class="fa-regular fa-user"></i>
                                <input type="text" name="fullName" placeholder="Enter full name" class="border-0 px-1"
                                    id="fullName">
                            </div>
                            <small class="text-danger"></small>
                        </div>
                        <div class="col-12 field">
                            <label>Email</label>
                            <div class="col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3">
                                <i class="fa-regular fa-envelope text-black"></i>
                                <input type="email" name="email" placeholder="Enter email address" class="border-0 px-1"
                                    id="email">
                            </div>
                            <small class="text-danger"></small>
                        </div>
                        <button type="submit" name="submit" class="col-12 color border-0 rounded-3 py-3 mt-4"
                            id="nextBtn">Next</button>
                    </form>
                    <form class="form2 d-none col-10 d-flex flex-column justify-content-center align-items-center py-4"
                        id="form2">
                        <div class="col-12 field">
                            <label>Password</label>
                            <div class="col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3">
                                <i class="fa-solid fa-lock text-black"></i>
                                <input type="password" name="password" id="password" placeholder="Enter Password"
                                    class="border-0 px-1">
                            </div>
                            <small class="text-danger"></small>
                        </div>
                        <div class="col-12 field">
                            <label>Confirm Password</label>
                            <div>
                                <div class="col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3">
                                    <i class="fa-solid fa-lock text-black"></i>
                                    <input type="password" name="confirmpassword" id="confirmpassword"
                                        placeholder="Confirm Password" class="border-0 px-1">
                                </div>
                            </div>
                            <small class="text-danger"></small>
                        </div>
                        <div class=" col-12 d-flex justify-content-between">
                            <div class="d-flex">
                                <input type="checkbox" name="checkbox">
                                <p class="mt-3">I agree to the Terms of Service & Privacy Policy</p>
                            </div>
                        </div>
                        <button type="submit" name="submit" class="col-12 color border-0 rounded-3 py-3"
                            id="createBtn">Create
                            Account</button>
                    </form>
                    <div class="d-flex col-10 my-4">
                        <hr class="col-4 text-secondary">
                        <p class="col-3 text-center">or continue with</p>
                        <hr class="col-4 text-secondary">
                    </div>
                    <div class="d-flex col-10 justify-content-center gap-4 mb-4">
                        <div class="icon-container border border-1 border-secondary rounded-5">
                            <a href="#googlePage"><img src="images/Google Icon.svg" class=""></a>
                        </div>
                        <div class="icon-container border border-1 border-secondary rounded-5">
                            <a href="#apple-support"><i class="fa-brands fa-apple fs-2 text-black"></i></a>
                        </div>
                        <div class="icon-container border border-1 border-secondary rounded-5">
                            <a href="https://ta3leem-online.com/" target="_blank"><i
                                    class="fa-brands fa-facebook blue fs-2"></i></a>
                        </div>
                    </div>
                    <p>Already have an account?<a href="login.html" class="blue"> Login</a></p>
                </div>
                <form class="form3 d-none col-10 d-flex flex-column justify-content-center align-items-center py-4"
                    id="form3">
                    <h1 class="text-center">Check your inbox</h1>
                    <p class="text-center">Enter the 6-digit code we sent to email address to finish your sign up.</p>
                    <div class="col-12 field">
                        <div
                            class="d-flex justify-content-between col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3 mb-2">
                            <div> <input type="text" name="code" id="code" placeholder="6-digit code"
                                    class="border-0 px-1">
                                <i class="fa-solid fa-lock text-black ms-5"></i>
                            </div>
                        </div>
                        <small class="text-danger my-3"></small>
                    </div>
                    <button type="submit" name="submit" class="col-12 color border-0 rounded-3 py-3 color"><a href="cards.html" class="text-dark">Sign Up</a></button> <button type="submit" name="submit"
                        class="col-12 color border-0 rounded-3 py-3 bg-white">Resend email</button>
                </form>

            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
