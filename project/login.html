<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.min.css">
</head>

<body>
    <section class="vh-100">
        <div class="row g-0">
            <div class="color col-12 col-lg-6">
                <img src="images/Image (1).png" class="img-fluid">
            </div>
            <div class="col-12 col-lg-6 d-flex flex-column justify-content-center align-items-center">
                <h1 class="text-center mb-4">Login</h1>
                <form class="col-10 " id="loginForm">
                    <div class="col-12 field">
                        <label>Email</label>
                        <div class="col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3 mb-2 emaildiv">
                            <i class="fa-regular fa-envelope text-black"></i>
                            <input type="text" name="email" id="email" placeholder="Enter email address"
                                class="border-0 px-1">
                        </div>
                        <small class="text-danger"></small>
                    </div>
                    <div class="col-12 field">
                        <label>Password</label>
                        <div
                            class="d-flex justify-content-between col-12 bg-white rounded-3 border border-1 border-secondary-subtle p-3 mb-2">
                            <div>
                                <i class="fa-solid fa-lock text-black"></i>
                                <input type="password" name="password" id="password" placeholder="Enter Password"
                                    class="border-0 px-1">
                            </div>
                        </div>
                        <small class="text-danger my-3"></small>
                    </div>
                    <div class=" col-12 d-flex justify-content-between">
                        <div class="d-flex">
                            <input type="checkbox" name="checkbox">
                            <p class="mt-3">Remember Me</p>
                        </div>
                        <a href="#forgotpass" class="text-danger mt-3">Forgot Password?</a>
                    </div>
                    <button type="submit" name="submit" id="formBtn"
                        class="col-12 color border-0 rounded-3 py-3">Login</button>
                </form>
                <div class="d-flex col-10 my-3">
                    <hr class="col-4 text-secondary">
                    <p class="col-3 text-center">or continue with</p>
                    <hr class="col-4 text-secondary">
                </div>
                <div class="d-flex col-10 justify-content-center gap-4 mb-4">
                    <div class="icon-container border border-1 border-secondary rounded-5">
                        <a href="#googlePage"><img src="images/Google Icon.svg" class=""></a>
                    </div>
                    <div class="icon-container border border-1 border-secondary rounded-5">
                        <a href="#apple-support"><i class="fa-brands fa-apple fs-2 text-black"></i></a>
                    </div>
                    <div class="icon-container border border-1 border-secondary rounded-5">
                        <a href="https://ta3leem-online.com/" target="_blank"><i
                                class="fa-brands fa-facebook blue fs-2"></i></a>
                    </div>
                </div>
                <p>Don’t have an account?<a href="signup.html" class="blue"> Sign Up</a></p>
            </div>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</body>

</html>
